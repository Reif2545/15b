<!DOCTYPE html>
<html lang="en">
<head>
  <title>Make a Payment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="main">

  <div class="topbar">Top Utility Bar</div>
  <div class="header">STPLS Logo + Search</div>

  <div class="nav">
    <a href="index.html">Home</a> |
    <a href="contact.html">Contact Us</a> |
    <a href="payment.html">Make a Payment</a>
  </div>

  <div class="contact-box">

    <h2>Payment Form</h2>

    <form action="https://us-central1-alhsofunctions.cloudfunctions.net/alhsoFormExample" method="post" class="contact-form">

      <!-- Contact Info Section -->
      <fieldset>
        <legend>Contact Information</legend>

        <div class="form-group">
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" name="user-name" required>
        </div>

        <div class="form-group">
          <label for="user-email">Email:</label>
          <input type="email" id="user-email" name="user-email" required>
        </div>
      </fieldset>

      <br>

      <!-- Payment Info Section -->
      <fieldset>
        <legend>Payment Information</legend>

        <div class="form-group">
          <label for="card-type">Card Type:</label>
          <select id="card-type" name="card-type" required>
            <option value="">-- Select Card Type --</option>
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
          </select>
        </div>

        <div class="form-group">
          <label for="card-number">Card Number:</label>
          <input type="text" id="card-number" name="card-number" required>
        </div>

        <div class="form-group">
          <label for="exp-date">Expiration Date:</label>
          <input type="date" id="exp-date" name="exp-date" required>
        </div>
      </fieldset>

      <br>

      <button type="submit">Submit Payment</button>

    </form>

  </div>

  <div class="footer">Footer</div>

</main>

</body>
</html>
